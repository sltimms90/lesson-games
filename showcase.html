<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo file · Lesson Desk</title>
<style>
:root{--bg:#F6F3EC;--ink:#1C2445;--muted:#5B6280;--card:#fff;--line:#E2DCCF;--accent:#2E6BE6}
@media (prefers-color-scheme:dark){:root{--bg:#141826;--ink:#EEF0F7;--muted:#A9B0C8;--card:#1E2336;--line:#323a55;--accent:#7FA7FF}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px 20px}
h1{font-size:24px;margin:0 0 8px}
p{margin:0 0 12px;color:var(--muted)}
p b{color:var(--ink)}
.tag{display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:12px}
</style>
</head>
<body>
<main>
<div class="card">
<span class="tag">Guest preview</span>
<h1>📄 A demo file</h1>
<p>In a real lesson this link opens the file in Google Drive: the worksheet, the homework sheet, the reader, the lesson plan or the student’s folder.</p>
<p>The demo school is made up, so there’s nothing to open here. <b>Close this tab</b> to go back to the lesson.</p>
</div>
</main>
</body>
</html>
