<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-7kDE8NUFMMwx8pbqGXWzTn3nKB95FSrY1Np94BAlMl0='; object-src 'none'; base-uri 'none'">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#1C2445; --muted:#59627F; --line:#D3DAE8;
  --soft:#E4EAF6; --ball:#2F6FDB; --ok:#1F8A57; --no:#D33B31; --amber:#B7791F;
  --c-bingo:#2F6FDB; --c-hangman:#D9483B; --c-anagrams:#1F8A57; --c-wheel:#7A4FD1;
  --c-slot:#EFA92E; --c-quiz:#0E8C9B; --c-taboo:#C2397A; --c-auction:#9A5B2E; --c-spelling:#5E7A12; --c-cards:#B5562B; --c-typeit:#3B5BA8; --c-match:#2E7D6B; --c-whack:#8A5A2B; --c-cross:#5A4FB0; --c-snakes:#1E8A5A; --c-hilo:#2B4FA8; --c-build:#B8860B; --c-spot:#C2304F; --c-odd:#A04478; --c-dice:#D2691E; --c-phon:#2A6F97;
  --stamp:rgba(47,111,219,.20);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11172A; --surface:#1B2340; --ink:#EDF0FA; --muted:#A5AECB; --line:#323C5E;
    --soft:#242E50; --ball:#5B8EF0; --ok:#45BC85; --no:#F06A61; --amber:#E7B04A;
    --c-bingo:#5B8EF0; --c-hangman:#F06A61; --c-anagrams:#45BC85; --c-wheel:#A483F0;
    --c-slot:#F2B94F; --c-quiz:#3DBFCD; --c-taboo:#E66BA6; --c-auction:#D08B55; --c-spelling:#A6C24A; --c-cards:#E8875A; --c-typeit:#7F9CF0; --c-match:#4FC2A6; --c-whack:#D39A5E; --c-cross:#A79CF2; --c-snakes:#5FCB8E; --c-hilo:#7F9CF0; --c-build:#E0B44A; --c-spot:#F0708A; --c-odd:#D47FB0; --c-dice:#F0A060; --c-phon:#6FAFD8;
    --stamp:rgba(91,142,240,.30);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11172A; --surface:#1B2340; --ink:#EDF0FA; --muted:#A5AECB; --line:#323C5E;
  --soft:#242E50; --ball:#5B8EF0; --ok:#45BC85; --no:#F06A61; --amber:#E7B04A;
  --c-bingo:#5B8EF0; --c-hangman:#F06A61; --c-anagrams:#45BC85; --c-wheel:#A483F0;
  --c-slot:#F2B94F; --c-quiz:#3DBFCD; --c-taboo:#E66BA6; --c-auction:#D08B55; --c-spelling:#A6C24A; --c-cards:#E8875A; --c-typeit:#7F9CF0; --c-match:#4FC2A6; --c-whack:#D39A5E; --c-cross:#A79CF2; --c-snakes:#5FCB8E; --c-hilo:#7F9CF0; --c-build:#E0B44A; --c-spot:#F0708A; --c-odd:#D47FB0; --c-dice:#F0A060; --c-phon:#6FAFD8;
  --stamp:rgba(91,142,240,.30);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
select,textarea,input{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.display{font-family:"Baloo 2","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(34px,6vw,52px);font-weight:800}
h2{font-size:clamp(26px,4vw,34px);font-weight:800}
h3{font-size:22px;font-weight:800}
.muted{color:var(--muted)}
.wrap{max-width:780px;margin:0 auto;padding:22px 18px 56px}
button{font:inherit;color:inherit}
.btn{font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:19px;line-height:1.1;border-radius:12px;padding:13px 20px;min-height:54px;border:2px solid transparent;background:var(--ink);color:var(--surface);cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--no);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:17px}
.btn.ic{min-width:44px;padding:8px 10px;font-size:21px;line-height:1;justify-content:center}
.btn.danger{background:transparent;color:var(--no);border-color:var(--no)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tile:focus-visible,.key:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:15px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--muted);background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--ok)} .pill.warn i{background:var(--amber)} .pill.bad i{background:var(--no)}
.toast.undo{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px} .toast.undo button{font:inherit;font-size:24px;line-height:1;min-width:48px;min-height:44px;border:0;border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;max-width:90vw;font-weight:700}

/* lists */
.head{margin:14px 0 22px}
.head p{margin:8px 0 0}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list .item{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:14px 4px;cursor:pointer}
.list .item b{font-family:"Baloo 2",sans-serif;font-size:21px;display:block;line-height:1.15}
.list .item small{color:var(--muted);font-size:15px}
.section{margin-top:30px}
.section h3{margin-bottom:10px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{display:inline;margin:0}
details.fold>summary::before{content:"▸";font-size:18px;color:var(--muted);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary .muted{font-size:15px}
details.fold[open]>summary{margin-bottom:10px}
details.help{display:inline-block;margin:2px 0 6px} details.help>summary{cursor:pointer;font-size:15px;color:var(--muted)}
details.help[open]{display:block} details.help p{margin:4px 0 0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:16px}
button.chip{cursor:pointer;min-height:40px}
.chip.again{border-color:var(--amber)}
.called .chip{font-size:clamp(20px,2.6vw,26px);padding:6px 16px;font-weight:600}
.called h3{font-size:20px}
/* Bingo's called words: a single line under the cards, newest on the left; older ones run off the right edge. */
.calledbar{display:flex;align-items:center;gap:12px;margin-top:14px;min-height:46px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.calledbar>b{flex:none;color:var(--muted);font-size:17px}
.calledbar .chips{flex-wrap:nowrap;overflow:hidden;min-width:0;text-overflow:ellipsis}
.calledbar .chip{flex:none;font-size:clamp(17px,2vw,22px);padding:4px 14px;font-weight:600;white-space:nowrap}
.grid{position:relative}
.grid .cell.inl{box-shadow:inset 0 0 0 3px var(--amber)}
.bglines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bglines line{stroke:var(--amber);stroke-width:8px;stroke-linecap:round;opacity:.85;vector-effect:non-scaling-stroke}
.mini{flex:none;width:52px;height:52px;border-radius:50%;background:var(--c,var(--ball));display:grid;place-items:center}
.mini span{width:58%;height:58%;border-radius:50%;background:#fff;color:#1C2445;display:grid;place-items:center;font:800 18px/1 "Baloo 2",sans-serif}
.game{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.game .body{flex:1;min-width:0}
.game b{font-family:"Baloo 2",sans-serif;font-size:22px;display:block;line-height:1.15}
.game .sum{font-size:15px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.game .row{margin-top:10px}
.add{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.add button{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:19px;text-align:left}
.add .mini{width:40px;height:40px}
.add .mini span{font-size:15px}

/* forms */
.field{margin:20px 0}
.field label,.legend{display:block;font-weight:700;margin-bottom:6px}
.field .hint{font-size:15px;color:var(--muted);margin-top:6px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:220px;resize:vertical;line-height:1.4}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;margin:0}
.choice label:has(input:checked){border-color:var(--ball);background:var(--soft)}
.choice label:has(input:disabled){opacity:.45;cursor:default}
.choice input{width:20px;height:20px;accent-color:var(--ball)}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--ball);flex:none}
.err{color:var(--no);font-weight:700;min-height:1.4em;margin:14px 0 0}
.code{max-width:150px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}

/* play shell */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{flex-wrap:wrap;row-gap:4px}
.nav-b{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.nav-sep{width:1px;align-self:stretch;margin:4px 4px;background:var(--line)}
.nav-sp{flex:1}
.nav-r{display:flex;gap:6px;align-items:center;margin-left:auto}
.nav .btn.ic.on{background:var(--soft);box-shadow:inset 0 -3px 0 var(--ball)}
.nav-stu.named{gap:6px;font-size:21px}
.home-r{gap:8px;align-items:center}
.pb-ent{position:relative}
.pb-badge{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--no);color:#fff;font:700 13px/21px system-ui,sans-serif;font-style:normal;text-align:center}
.pb-prev{margin:4px 0 0;font-size:15px}
.linkish{background:none;border:0;padding:0;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.pb .pb-sec h3{margin:0 0 6px}
.pb-n{font-size:15px;font-weight:400}
.pb-list{list-style:none;margin:0;padding:0}
.pb-list,.pb-list *{box-sizing:border-box}   /* a <details> body doesn't pass box-sizing down in Chrome */
.pb-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.pb-row.look{flex-wrap:wrap}
.pb-row.look .pb-b{flex:1 1 100%;justify-content:flex-start;min-width:0}
.pb-t{flex:1 1 8em;min-width:0}
.pb-t b{font-family:"Baloo 2",sans-serif;font-size:20px;line-height:1.15}
.pb-lp{margin-left:8px;font-weight:700;font-size:16px}
.pb-t small{display:block;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-wait.late{color:var(--amber);font-weight:700}
.pb-b{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pb-row.look .pb-b .btn:not(.ic){font-size:15px;padding:7px 10px;min-height:40px}
.pb input[type=date]{width:auto;flex:0 1 12em;min-width:0;font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.nav-stu .nav-nm{font-size:16px;font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stage{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.progress{font-size:17px;color:var(--muted)}
.claims{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.claim{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px}
.claim .who{font-weight:700;margin-bottom:10px}
.claim .row{justify-content:center}
.claim input{margin-top:10px}
.notice{font-size:17px;color:var(--muted)}
.big-btn{min-width:220px;font-size:22px;min-height:62px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:20px}
.pop{background:var(--surface);border-radius:22px;padding:28px 24px;max-width:440px;width:100%;text-align:center}
.pop .big{font:800 clamp(54px,12vw,84px)/1 "Baloo 2",sans-serif;color:var(--ball)}
.pop p{margin:10px 0 20px;font-size:20px}
.pop .row{justify-content:center}

/* bingo */
.play2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:start}
@media (max-width:820px){.play2{grid-template-columns:minmax(0,1fr)}}
.ball{width:min(44vw,180px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 32%),var(--c-bingo);
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.14)}
.ball span{width:58%;aspect-ratio:1;border-radius:50%;background:#fff;color:#1C2445;display:grid;place-items:center;font:800 clamp(34px,7vw,56px)/1 "Baloo 2",sans-serif}
.ball.drop{animation:drop .55s cubic-bezier(.2,.9,.3,1.25)}
@keyframes drop{from{transform:translateY(-60px) rotate(-160deg);opacity:0}to{transform:none;opacity:1}}
.callword{font:800 clamp(40px,7.5vw,70px)/1.02 "Baloo 2",sans-serif;overflow-wrap:anywhere}
.calldef{font:700 clamp(24px,3.6vw,36px)/1.25 "Baloo 2",sans-serif;max-width:30ch}
.called{width:100%;text-align:left}
.called h3{font-size:18px;color:var(--muted);margin:6px 0 8px}
.cards{display:grid;gap:18px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px 10px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:20px}
.badge{font-size:16px;color:var(--ok)}
.grid{display:grid;gap:6px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cell{position:relative;aspect-ratio:1;border-radius:10px;background:var(--soft);display:grid;place-items:center;text-align:center;padding:4px;font-weight:700;font-size:clamp(12px,1.7vw,19px);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
/* Cell text scales with the card, not the window, so a phone's card reads as well as an iPad's. */
.grid{container-type:inline-size}
.grid .cell{font-size:clamp(12px,calc(100cqi / var(--n,4) * .19),34px)}
.grid .cell.long{font-size:clamp(11px,calc(100cqi / var(--n,4) * .14),28px)}
/* Older iPhones/iPads (before iOS 16) don't know container units: size from the screen, assuming the card is about
   the screen's width on a phone and half of it (max 560px) on bigger screens. */
@supports not (width:1cqi){
  .grid .cell{font-size:clamp(12px,calc(min(100vw - 40px,560px) / var(--n,4) * .19),34px)}
  .grid .cell.long{font-size:clamp(11px,calc(min(100vw - 40px,560px) / var(--n,4) * .14),28px)}
}
.cell.free{background:transparent;border:2px dashed var(--line);color:var(--muted);font-family:"Baloo 2",sans-serif}
.cell.on::after{content:"";position:absolute;inset:9%;border-radius:50%;background:var(--stamp);border:4px solid var(--c-bingo)}
.cell.on.fresh::after{animation:stamp .35s ease-out}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}

/* hangman */
.balloons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:76px;align-items:flex-end}
.balloon{width:40px;height:50px;border-radius:50% 50% 46% 46%;background:var(--c-hangman);position:relative;margin-bottom:22px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.14)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:22px;background:var(--muted)}
.balloon.popped{background:transparent;border:2px dashed var(--line);box-shadow:none}
.balloon.popped::after{background:var(--line)}
.balloon.pop{animation:popit .4s ease-out}
@keyframes popit{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%}
.slot{min-width:clamp(34px,6vw,56px);height:clamp(48px,8vw,74px);border-bottom:4px solid var(--ink);display:grid;place-items:end center;font:800 clamp(32px,6vw,56px)/1 "Baloo 2",sans-serif;padding-bottom:4px;text-transform:uppercase}
.slot.gap{border:0;min-width:clamp(14px,2.5vw,24px)}
.slot.punct{border-color:transparent}
.slot.missed{color:var(--no)}
.wrong{font-size:20px;min-height:1.5em}
.wrong b{color:var(--no);letter-spacing:.12em;text-transform:uppercase}
.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%;max-width:640px}
.key{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:800 26px/1 "Baloo 2",sans-serif;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
.key.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.key.miss{background:transparent;color:var(--line);border-color:var(--line)}
.key:disabled{cursor:default}
.cluebox{font-size:22px;font-weight:700;max-width:36ch}
.verdict{font:800 clamp(30px,5vw,44px)/1.1 "Baloo 2",sans-serif}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

/* anagrams */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.aslot{width:clamp(42px,7vw,64px);height:clamp(52px,8.5vw,76px);border-radius:12px;border:3px dashed var(--line);display:grid;place-items:center;font:800 clamp(28px,5vw,44px)/1 "Baloo 2",sans-serif;background:transparent;cursor:pointer;padding:0}
.aslot.filled{border-style:solid;border-color:var(--c-anagrams);background:var(--surface)}
.slots .aslot,.tiles .tile{touch-action:none;-webkit-user-select:none;user-select:none}
.tiles{min-height:clamp(58px,9vw,80px)}
.aslot.over{border-color:var(--c-anagrams);border-style:solid;transform:scale(1.08)}
.tiles.over{outline:3px dashed var(--c-anagrams);outline-offset:6px;border-radius:14px}
.an-lift{opacity:.35}
.an-ghost{position:fixed;z-index:1000;pointer-events:none;transform:scale(1.12);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.aslot.gap{border:0;width:clamp(14px,2.5vw,24px);cursor:default}
.slots.right .aslot.filled{background:var(--c-anagrams);color:#fff}
.slots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:80px}
.tile{width:clamp(50px,8vw,72px);height:clamp(58px,9vw,80px);border-radius:14px;border:0;background:var(--c-anagrams);color:#fff;font:800 clamp(30px,5.5vw,46px)/1 "Baloo 2",sans-serif;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);touch-action:manipulation}

/* wheel */
.wheelbox{position:relative;width:min(88vw,460px);aspect-ratio:1}
.wheelbox svg.wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--ink);z-index:2}
.prompt{font:800 clamp(28px,4.6vw,46px)/1.15 "Baloo 2",sans-serif;max-width:24ch}
.wheel-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:820px){.wheel-layout{grid-template-columns:minmax(0,1fr)}}

/* slot machine */
.cabinet{width:100%;max-width:860px;background:var(--c-slot);border-radius:26px;padding:16px 14px 14px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.14)}
.reels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.reel{display:flex;flex-direction:column;gap:8px;min-width:0}
.reel .lab{font:800 17px/1 "Baloo 2",sans-serif;color:#1C2445;text-align:center}
.window{background:#fff;color:#1C2445;border-radius:14px;min-height:clamp(100px,17vw,150px);display:grid;place-items:center;text-align:center;padding:8px;font:800 clamp(20px,3.6vw,36px)/1.1 "Baloo 2",sans-serif;overflow-wrap:anywhere;hyphens:auto;box-shadow:inset 0 12px 12px -9px rgba(0,0,0,.35),inset 0 -12px 12px -9px rgba(0,0,0,.35)}
.window.blur{filter:blur(1.2px);opacity:.7}
.window.held{outline:4px solid #1C2445;outline-offset:-4px}
.hold{min-height:46px;border-radius:12px;border:2px solid #1C2445;background:transparent;color:#1C2445;font:700 18px/1 "Baloo 2",sans-serif;cursor:pointer;touch-action:manipulation}
.hold[aria-pressed=true]{background:#1C2445;color:#fff}
.hold:disabled{opacity:.35;cursor:default}
.hold:focus-visible,.opt:focus-visible,.seg button:focus-visible,button.check:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

/* quiz */
.score{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;text-align:center}
.score .n{display:block;font:800 clamp(34px,6vw,52px)/1 "Baloo 2",sans-serif;color:var(--c-quiz)}
.score .n.pot{color:var(--amber)}
.score small{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.qtext{font:800 clamp(26px,4.4vw,42px)/1.15 "Baloo 2",sans-serif;max-width:28ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:860px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{min-height:78px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);font:700 clamp(19px,2.6vw,25px)/1.2 "Atkinson Hyperlegible",sans-serif;padding:12px 16px;text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer;touch-action:manipulation}
.opt .k{flex:none;width:38px;height:38px;border-radius:50%;background:var(--c-quiz);color:var(--surface);display:grid;place-items:center;font:800 19px/1 "Baloo 2",sans-serif}
.opt.right{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.chose{border-color:var(--no);background:var(--no);color:#fff}
.opt.right .k,.opt.chose .k{background:#fff;color:#1C2445}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
button.check{font:inherit;color:var(--ink);max-width:520px;width:100%}
button.check .tick{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--ok)}
button.check[aria-pressed=true]{border-color:var(--ok)}

/* taboo */
.cover{width:100%;max-width:560px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.covermsg{font:700 clamp(22px,3.4vw,30px)/1.25 "Baloo 2",sans-serif;margin:0}
.seg{display:flex;flex-wrap:wrap;justify-content:center;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:transparent;padding:12px 16px;min-height:48px;font:700 18px/1.1 "Baloo 2",sans-serif;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--c-taboo);color:var(--surface)}
.tcard{width:100%;max-width:520px;background:var(--surface);border:4px solid var(--c-taboo);border-radius:22px;overflow:hidden}
.tcard .tgt{background:var(--c-taboo);color:var(--surface);font:800 clamp(36px,6.4vw,58px)/1.05 "Baloo 2",sans-serif;padding:22px 16px;overflow-wrap:anywhere}
.tcard ul{list-style:none;margin:0;padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.tcard li{font:700 clamp(21px,3vw,27px)/1.25 "Atkinson Hyperlegible",sans-serif;}
.counter .dots{display:inline-flex;gap:6px;align-items:center;margin-left:10px}
.counter .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.counter .dots i.on{background:var(--ok);border-color:var(--ok)}

.tcard .tsay{padding:12px 18px 0;font-size:15px;color:var(--muted);font-weight:700}
.tcard .tsay + ul{padding-top:4px}

/* quiz extras: lifelines, timer, bets, bonus round */
.lifes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.life{min-height:44px;border-radius:999px;border:2px solid var(--c-wheel);background:var(--surface);color:var(--ink);font:700 17px/1 "Baloo 2",sans-serif;padding:8px 16px;cursor:pointer;touch-action:manipulation}
.life:disabled{opacity:.35;cursor:default}
.life:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.qtimer{display:flex;align-items:center;gap:12px;width:100%;max-width:620px}
.qtimer span{font:800 26px/1 "Baloo 2",sans-serif;min-width:2ch;text-align:right}
.tbar{flex:1;height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c-quiz);transition:width .2s linear}
.tbar.low i{background:var(--no)}
.opt.gone{opacity:.15;text-decoration:line-through;cursor:default}
.bet{display:flex;align-items:center;gap:14px}
.bet .btn{min-width:60px;font-size:28px}
.betn{text-align:center;min-width:120px}
.betn b{display:block;font:800 40px/1 "Baloo 2",sans-serif;color:var(--amber)}
.betn small{color:var(--muted);font-size:15px}
/* Win or lose: a typed amount and All in, beside the − / + bet (Nov 2026). 16px+ so phones don't zoom in on it. */
.qz-betx{justify-content:center;align-items:center}
.qz-amt{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--muted)}
.qz-amt input{width:7.5em;font:700 20px/1.2 "Baloo 2",sans-serif;text-align:center;padding:8px 10px}
/* grammar auction */
.score .n.au{color:var(--c-auction)}
.score .n.sp{color:var(--c-spelling)}
.lasttime{text-align:center;color:var(--muted);font-size:15px;margin:0 0 6px}
.spin{font:800 clamp(28px,5vw,44px)/1.2 "Baloo 2",sans-serif;text-align:center;max-width:16ch;width:100%;padding:12px 16px;border:4px solid var(--c-spelling);border-radius:18px;background:var(--surface);color:var(--text)}
.spword{font:800 clamp(28px,5vw,44px)/1.2 "Baloo 2",sans-serif;color:var(--ok)}
.splist{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px}
.sprow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:18px;cursor:pointer}
.sprow .w{font-weight:800}.sprow.ok .m{color:var(--ok);font-weight:800}.sprow.no .m{color:var(--no);font-weight:800}.sprow.no .t{color:var(--no)}
.cover{padding:22px;border:3px dashed var(--line);border-radius:18px;text-align:center;max-width:520px;width:100%}
.qtag{font-size:12px;font-weight:800;color:var(--muted);margin-left:4px}
.ausent{font:800 clamp(26px,4.4vw,42px)/1.2 "Baloo 2",sans-serif;max-width:30ch;padding:18px 22px;border:4px solid var(--c-auction);border-radius:20px;background:var(--surface);overflow-wrap:anywhere}
.ausent.bad{border-color:var(--no)}
.aufix{display:flex;flex-direction:column;gap:8px;max-width:30ch;font:800 clamp(22px,3.6vw,34px)/1.2 "Baloo 2",sans-serif}
.aufix .was{text-decoration:line-through;text-decoration-color:var(--no);color:var(--muted)}
.aufix .now{color:var(--ok)}
.aufix .now::before{content:"✓ "}
.bonus-h{color:var(--c-wheel)}
.bwrap{position:relative;width:100%;max-width:540px;aspect-ratio:1/.92}
.bcard{position:absolute;width:31%;height:47.5%;padding:0;border:0;background:none;perspective:900px;cursor:pointer;transition:left .7s ease-in-out,top .7s ease-in-out,transform .2s;touch-action:manipulation}
.bcard.moving{z-index:2;transform:scale(1.07)}
.bcard:disabled{cursor:default}
.bcard .in{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}
.bcard.down .in{transform:rotateY(180deg)}
.bcard .f,.bcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 clamp(18px,3.6vw,36px)/1 "Baloo 2",sans-serif}
.bcard .f{background:var(--surface);border:3px solid var(--line)}
.bcard .f small{font:700 clamp(10px,1.4vw,13px)/1 "Atkinson Hyperlegible",sans-serif;color:var(--muted)}
.bcard .f.pos{color:var(--ok);border-color:var(--ok)}
.bcard .f.neg{color:var(--no);border-color:var(--no)}
.bcard .f.life{color:var(--c-wheel);border-color:var(--c-wheel)}
.bcard .b{background:var(--c-quiz);color:var(--surface);transform:rotateY(180deg);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);font-size:clamp(30px,6vw,56px)}
.bcard.picked .f{box-shadow:0 0 0 5px var(--ink)}
.bcard.other{opacity:.5}
.bcard:focus-visible{outline:3px solid var(--ball);outline-offset:3px;border-radius:14px}
/* pause */
.clock{font:800 19px/1 "Baloo 2",sans-serif;font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.4em}
.pausebox{max-width:520px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
/* per-item results */
.scorebig{font:800 clamp(30px,5vw,44px)/1.1 "Baloo 2",sans-serif;margin:6px 0 4px}
.itbl{overflow-x:auto;margin:14px 0 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.itbl table{width:100%;border-collapse:collapse;font-size:16px}
.itbl th{text-align:left;font-size:14px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
.itbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.itbl tr:last-child td{border-bottom:0}
.itbl .num{text-align:right;white-space:nowrap}
.rs-res{display:block;color:var(--ok);font-weight:700;font-size:15px;margin-top:2px}
.itbl td small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.itbl tr.good td:nth-child(3) b{color:var(--ok)}
.itbl tr.bad td:nth-child(3) b{color:var(--no)}
@media (prefers-reduced-motion:reduce){.bcard .in,.tbar i{transition:none}.bcard{transition:left .45s ease-in-out,top .45s ease-in-out}}

/* bingo layouts and self-marking */
.play1{max-width:760px;margin:0 auto}
.play3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.play3 .ball{width:min(26vw,150px)}
.play3 .callword{font-size:clamp(34px,4.6vw,60px)}
@media (max-width:980px){.play3{grid-template-columns:minmax(0,1fr)}.play3 .callcol{order:-1}}
@media (max-width:820px){.play2 .callcol{order:-1}}
/* Bingo, landscape iPad and desktop: a column with one card fills the screen height. Cells grow taller than wide
   and the words grow with them, instead of leaving the bottom half empty. The call column narrows in play3. */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .play3{grid-template-columns:minmax(0,1fr) minmax(200px,250px) minmax(0,1fr)}
  .play3 .callword{font-size:clamp(24px,2.9vw,40px);overflow-wrap:normal;word-break:normal;hyphens:auto}
  :is(.play2,.play3)>.cards:has(>.card:only-child)>.card{height:calc(100dvh - 188px);max-height:calc(100dvh - 188px);display:flex;flex-direction:column;min-height:0}
  :is(.play2,.play3)>.cards:has(>.card:only-child)>.card>.grid{flex:1;min-height:0;grid-template-rows:repeat(var(--n),minmax(0,1fr));container-type:size}
  :is(.play2,.play3)>.cards:has(>.card:only-child)>.card>.grid .cell{aspect-ratio:auto;font-size:clamp(13px,min(calc(100cqi / var(--n,4) * .2),calc(100cqb / var(--n,4) * .26)),44px)}
  .play2>.cards:has(>.card:only-child)>.card{max-width:calc(100dvh - 100px);justify-self:center;width:100%}
}
button.cell{border:0;font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button.cell:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.cell.nope{animation:shake .4s;background:color-mix(in srgb,var(--no) 22%,var(--soft))}
.card.teacher{border-color:var(--amber)}
.card.teacher .cell.on::after{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 22%,transparent)}
.setpop{text-align:left;max-height:90vh;overflow:auto}
.setpop .legend{display:block;font-weight:700;margin-bottom:8px}
.setopt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font:inherit;color:var(--ink)}
.setopt[aria-pressed=true]{border-color:var(--ball);background:var(--soft)}
.setopt:disabled{opacity:.45;cursor:default}
.setopt small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.setopt:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.cell.nope{animation:none}}

/* results */
.results textarea{min-height:170px;font-size:17px}
.ok-msg{color:var(--ok);font-weight:700;min-height:1.4em;margin-top:10px}
.hist{margin:0;padding:0;list-style:none}
.hist li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hist .when{font-size:15px;color:var(--muted)}
.hist pre{white-space:pre-wrap;font:inherit;font-size:16px;margin:6px 0 0}

@media (prefers-reduced-motion:reduce){.ball.drop,.cell.on.fresh::after,.balloon.pop,.slots.shake{animation:none}}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000}
  :root{padding:0}
  body::before{display:none}
  #app,.toast{display:none}
  #print{display:block}
  .pcard{break-inside:avoid;page-break-inside:avoid;border:2px solid #000;border-radius:6mm;padding:5mm;margin:0 auto 6mm;width:max-content;font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:#000}
  .pcard .ph{display:flex;justify-content:space-between;gap:10mm;font:700 15pt/1.2 "Baloo 2",Arial,sans-serif;margin-bottom:3mm}
  .pgrid{display:grid;gap:1.5mm}
  .pc{border:1.5px solid #000;border-radius:2mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5mm;font-weight:700;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
  .pc.free{border-style:dashed;font-family:"Baloo 2",Arial,sans-serif}
  .pf{font-size:9pt;margin-top:2.5mm;color:#333}
  /* Bingo prints two cards side by side on landscape A4 */
  .ppage{display:flex;justify-content:space-around;align-items:flex-start;gap:6mm}
  .ppage .pcard{margin:0}
  .break{break-after:page;page-break-after:always}
  .tph{font:700 14pt/1.2 "Baloo 2",Arial,sans-serif;margin-bottom:4mm}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  .tpc{break-inside:avoid;page-break-inside:avoid;border:2px solid #000;border-radius:4mm;overflow:hidden;font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:#000}
  .tpt{font:800 22pt/1.1 "Baloo 2",Arial,sans-serif;padding:4mm;border-bottom:2px solid #000;text-align:center}
  .tpl{font-size:9pt;padding:2.5mm 4mm 0}
  .tpc ul{margin:0;padding:1mm 4mm 4mm 9mm;font-size:14pt;font-weight:700;line-height:1.35}
  .apl{font-size:12pt;margin:0 0 5mm}
  .aplist{margin:0;padding-left:9mm;font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:15pt;line-height:1.35}
  .aplist li{break-inside:avoid;page-break-inside:avoid;margin-bottom:6mm}
  .aplist .as{display:block;font-weight:700}
  .aplist .ab{display:block;font-size:12pt;margin-top:2mm}
}

/* ---------- looks (chosen per student, or per lesson) ---------- */
.cluewarn{font-size:15px;font-weight:700;color:var(--amber);margin:2px 0 6px}
.lookrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lookrow > *{min-width:0}
.lookrow select{font:inherit;font-size:17px;min-height:46px;width:100%;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px}
.hmlives{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:76px;align-items:flex-end}
.hmlife{width:44px;height:50px;display:block;transition:opacity .35s,transform .35s,filter .35s}
.hmlife svg{width:100%;height:100%;display:block}
.hmlife.gone{opacity:.18;filter:grayscale(1);transform:translateY(10px) rotate(-14deg)}
.hmlife.fall{animation:lifefall .5s ease-in}
@keyframes lifefall{0%{opacity:1;filter:none;transform:none}100%{opacity:.18;transform:translateY(10px) rotate(-14deg)}}
.gallows{width:min(52vw,210px);height:auto;display:block}
.gallows line,.gallows circle{stroke:var(--ink);stroke-width:6;stroke-linecap:round;fill:none}
.gallows .new{animation:chalkin .45s ease-out}
@keyframes chalkin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.hmlife,.hmlife.fall,.gallows .new{animation:none;transition:none}}

:root[data-look="chalk"]{
  --bg:#1E3A2F; --surface:#264738; --ink:#F1EFE4; --muted:#B4C4B4; --line:#4C6C5C; --soft:#2D5242;
  --ball:#F2D16B; --ok:#8FD694; --no:#F2938A; --amber:#F2D16B;
  --c-bingo:#F2D16B; --c-hangman:#F1EFE4; --c-anagrams:#8FD694; --c-wheel:#C9B3F2; --c-slot:#F2D16B;
  --c-quiz:#8FD3DE; --c-taboo:#F2A6C8; --c-auction:#E3B98A; --c-spelling:#C9DE8A; --stamp:rgba(242,209,107,.22);
  color-scheme:dark;
}
:root[data-look="chalk"] body{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.05),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.04),transparent 45%),var(--bg)}
:root[data-look="chalk"] .slot,:root[data-look="chalk"] .verdict,:root[data-look="chalk"] .wrong b,:root[data-look="chalk"] .key,:root[data-look="chalk"] h1,:root[data-look="chalk"] h2{font-family:"Kalam","Baloo 2",cursive}
:root[data-look="chalk"] .btn:not(.ghost):not(.ok):not(.no):not(.danger){background:var(--ink);color:var(--bg)}

:root[data-look="clouds"]{
  --bg:#F3EEFB; --surface:#FFFFFF; --ink:#3D3450; --muted:#776C8C; --line:#DED2EE; --soft:#ECE3F8;
  --ball:#8E6CC8; --ok:#3F9670; --no:#D35D74; --amber:#B9802A;
  --c-bingo:#8E6CC8; --c-hangman:#B48CDB; --c-anagrams:#4FA88A; --c-wheel:#9F7BD8; --c-slot:#E0A045;
  --c-quiz:#4C9FB0; --c-taboo:#D1709A; --c-auction:#B07A55; --c-spelling:#7FA03A; --stamp:rgba(142,108,200,.2);
  color-scheme:light;
}
:root[data-look="clouds"] body{background:radial-gradient(circle,rgba(180,140,219,.13) 1.5px,transparent 2px) 0 0/26px 26px,var(--bg)}

:root[data-look="bats"]{
  --bg:#1D1327; --surface:#2A1B38; --ink:#F7E8F2; --muted:#BFA7C9; --line:#4A3460; --soft:#352348;
  --ball:#FF8FC2; --ok:#7BD8B0; --no:#FF7FA8; --amber:#F5C66B;
  --c-bingo:#FF8FC2; --c-hangman:#FF8FC2; --c-anagrams:#7BD8B0; --c-wheel:#B79BF2; --c-slot:#F5C66B;
  --c-quiz:#7FD0E0; --c-taboo:#FF8FC2; --c-auction:#E0A77C; --c-spelling:#BFDB7A; --stamp:rgba(255,143,194,.22);
  color-scheme:dark;
}
:root[data-look="bats"] body{background:radial-gradient(circle,rgba(255,255,255,.18) 1px,transparent 1.5px) 0 0/44px 44px,radial-gradient(circle,rgba(255,143,194,.12) 1px,transparent 1.5px) 22px 22px/44px 44px,var(--bg)}

:root[data-look="pumpkins"]{
  --bg:#231A2D; --surface:#2F2340; --ink:#FFF0DE; --muted:#CDB7A6; --line:#4D3A5E; --soft:#3A2B4D;
  --ball:#FF9A2E; --ok:#9BD46B; --no:#FF6B4A; --amber:#FFC24A;
  --c-bingo:#FF9A2E; --c-hangman:#FF9A2E; --c-anagrams:#9BD46B; --c-wheel:#B48CF0; --c-slot:#FFC24A;
  --c-quiz:#6FD0C6; --c-taboo:#FF8A6B; --c-auction:#E0A060; --c-spelling:#C2DE6E; --stamp:rgba(255,154,46,.22);
  color-scheme:dark;
}

:root[data-look="snow"]{
  --bg:#E8F2EF; --surface:#FFFFFF; --ink:#173B33; --muted:#557169; --line:#CCDFD9; --soft:#DCEBE6;
  --ball:#C8323B; --ok:#1E8A5A; --no:#C8323B; --amber:#B07A12;
  --c-bingo:#C8323B; --c-hangman:#C8323B; --c-anagrams:#1E8A5A; --c-wheel:#2F6FDB; --c-slot:#C99A1E;
  --c-quiz:#147F8C; --c-taboo:#B5397A; --c-auction:#8A5A2E; --c-spelling:#4F7A12; --stamp:rgba(200,50,59,.18);
  color-scheme:light;
}
:root[data-look="snow"] body{background:radial-gradient(circle,rgba(23,59,51,.10) 2px,transparent 2.5px) 0 0/34px 34px,radial-gradient(circle,rgba(23,59,51,.07) 1.5px,transparent 2px) 17px 17px/34px 34px,var(--bg)}

/* flash cards + type the answer */
.score .n.fc{color:var(--c-cards)} .score .n.ty{color:var(--c-typeit)}
.fcard{width:min(92vw,560px);min-height:clamp(200px,34vh,300px);border-radius:22px;border:4px solid var(--c-cards);background:var(--surface);display:grid;place-items:center;padding:24px;text-align:center;font:800 clamp(28px,5vw,46px)/1.2 "Baloo 2",sans-serif;cursor:pointer;color:var(--ink)}
.fcard.back{background:var(--soft)}
.fcard small{display:block;font:600 16px/1.3 "Atkinson Hyperlegible",sans-serif;color:var(--muted);margin-top:10px}
.fcfront{font:700 clamp(18px,2.6vw,22px)/1.3 "Atkinson Hyperlegible",sans-serif;color:var(--muted);max-width:36ch}
.tyq{font:800 clamp(24px,4vw,38px)/1.25 "Baloo 2",sans-serif;max-width:26ch}
.tyin{font:800 clamp(26px,4.6vw,40px)/1.2 "Baloo 2",sans-serif;text-align:center;max-width:22ch;width:100%;padding:12px 16px;border:4px solid var(--c-typeit);border-radius:18px;background:var(--surface);color:var(--ink)}
.again{font-size:15px;color:var(--amber);font-weight:700}

/* match up / sort / pairs */
.mu-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;width:100%;max-width:820px;text-align:left}
@media (max-width:640px){.mu-wrap{grid-template-columns:1fr}}
.mu-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mu-l{padding:10px 12px;border-radius:12px;background:var(--soft);font-weight:700;display:flex;align-items:center}
.mu-slot{min-height:54px;border-radius:12px;border:3px dashed var(--line);background:transparent;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;padding:8px;text-align:left}
.mu-slot.filled{border-style:solid;border-color:var(--c-match);background:var(--surface)}
.mu-slot.ok{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)} .mu-slot.no{border-color:var(--no);box-shadow:inset 0 0 0 2px var(--no)}
.mu-fix{display:block;font-size:15px;color:var(--ok)}
.mu-tiles{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.mu-tile{border:0;border-radius:12px;background:var(--c-match);color:#fff;font:700 18px/1.2 "Atkinson Hyperlegible",sans-serif;padding:10px 14px;min-height:50px;cursor:pointer;touch-action:manipulation;text-align:left}
.mu-tile.sel{outline:4px solid var(--ink);outline-offset:2px}
.so-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%;max-width:900px}
.so-box{border:3px dashed var(--line);border-radius:16px;min-height:130px;padding:10px;cursor:pointer;text-align:left;color:var(--ink)}
.so-box.target{border-color:var(--c-match);border-style:solid}
.so-box h4{margin:0 0 8px;font:800 20px/1.1 "Baloo 2",sans-serif}
.so-item{margin:3px;padding:6px 10px;border-radius:10px;background:var(--surface);border:2px solid var(--c-match);font:700 16px/1.2 "Atkinson Hyperlegible",sans-serif;color:var(--ink);cursor:pointer}
.so-item.ok{border-color:var(--ok)} .so-item.no{border-color:var(--no);color:var(--no)}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%;max-width:820px}
.mp-tile{aspect-ratio:4/3;border-radius:14px;border:0;background:var(--c-match);color:#fff;font:800 30px/1 "Baloo 2",sans-serif;cursor:pointer;display:grid;place-items:center;padding:8px;touch-action:manipulation}
.mp-tile.open{background:var(--surface);color:var(--ink);border:3px solid var(--c-match);font:700 18px/1.2 "Atkinson Hyperlegible",sans-serif}
.mp-tile.open.no{border-color:var(--no)} .mp-tile.open.yes{border-color:var(--ok)}
.mp-tile.done{background:transparent;color:var(--muted);border:2px dashed var(--line);font:600 15px/1.2 "Atkinson Hyperlegible",sans-serif;cursor:default}
.score .n.mu{color:var(--c-match)} .score .n.wh{color:var(--c-whack)} .score .n.cw{color:var(--c-cross)}
/* whack-a-mole */
.wh-prompt{font:800 clamp(24px,4vw,36px)/1.2 "Baloo 2",sans-serif;max-width:26ch}
.wh-bar{height:12px;border-radius:999px;background:var(--soft);width:min(92vw,560px);overflow:hidden}
.wh-bar i{display:block;height:100%;background:var(--c-whack);transition:width .1s linear}
.wh-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(92vw,560px)}
.wh-hole{position:relative;aspect-ratio:1.2;border-radius:50% 50% 18px 18px/34% 34% 18px 18px;background:var(--soft);overflow:hidden;box-shadow:inset 0 -14px 0 rgba(0,0,0,.14)}
.wh-mole{position:absolute;left:7%;right:7%;bottom:0;height:80%;border-radius:46% 46% 12px 12px;background:var(--c-whack);color:#fff;display:grid;place-items:center;text-align:center;font:800 clamp(15px,2.8vw,23px)/1.1 "Baloo 2",sans-serif;padding:8px 6px 4px;transform:translateY(105%);transition:transform .16s ease-out,background .1s;border:0;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.wh-mole::before,.wh-mole::after{content:"";position:absolute;top:14%;width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.55)}
.wh-mole::before{left:32%}.wh-mole::after{right:32%}
.wh-mole span{margin-top:18%}
.wh-mole.up{transform:translateY(6%)}
.wh-mole.good{background:var(--ok)} .wh-mole.bad{background:var(--no)}
@media (prefers-reduced-motion:reduce){.wh-mole{transition:none}}
/* crossword */
.cw-layout{display:grid;grid-template-columns:auto minmax(240px,1fr);gap:22px;align-items:start;width:100%;max-width:1000px;text-align:left}
@media (max-width:780px){.cw-layout{grid-template-columns:1fr;justify-items:center}}
.cw-grid{display:grid;gap:2px}
.cw-left{min-width:0}
/* Wide landscape: entry under the grid, Across and Down side by side, so many long clues don't shrink the page. */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .cw-layout{grid-template-columns:auto minmax(0,1fr);max-width:1140px}
  .cw-clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .cw-clues h3{margin-top:0}
  .cw-act{grid-column:1/-1}
}
.cw-c{width:var(--cs);height:var(--cs);background:var(--surface);border:2px solid var(--ink);position:relative;display:grid;place-items:center;font:800 calc(var(--cs)*.55)/1 "Baloo 2",sans-serif;text-transform:uppercase;cursor:pointer;padding:0;color:var(--ink);border-radius:3px}
.cw-c.x{background:transparent;border:0;cursor:default}
.cw-c small{position:absolute;top:1px;left:3px;font:700 calc(var(--cs)*.26)/1 "Atkinson Hyperlegible",sans-serif;color:var(--muted)}
.cw-c.sel{background:var(--soft);border-color:var(--c-cross)} .cw-c.ok{color:var(--ok)} .cw-c.no{color:var(--no)}
.cw-clues h3{font-size:20px;margin:6px 0}
.cw-clue{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:6px 8px;border-radius:8px;cursor:pointer}
.cw-clue.sel{background:var(--soft);outline:2px solid var(--c-cross)} .cw-clue.ok{color:var(--ok)} .cw-clue.no{color:var(--no)}
.cw-entry{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.cw-entry input{font:800 24px/1.2 "Baloo 2",sans-serif;padding:8px 12px;border:3px solid var(--c-cross);border-radius:12px;background:var(--surface);color:var(--ink);width:min(100%,280px);text-transform:uppercase}
@media print{
  .pcw{font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:#000}
  .pcw h2{font:700 16pt/1.2 "Baloo 2",Arial,sans-serif;margin:0 0 4mm}
  .pcwg{display:grid;gap:0;margin-bottom:6mm}
  .pcwc{width:8mm;height:8mm;border:1px solid #000;position:relative}
  .pcwc.x{border:0}
  .pcwc small{position:absolute;top:.3mm;left:.6mm;font-size:6pt}
  .pcwl{columns:2;column-gap:10mm;font-size:11pt;line-height:1.5}
  .pcwl h3{font-size:12pt;margin:0 0 1mm}
}

/* snakes & ladders */
.sn-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.sn-board{position:relative;width:min(94vw,calc(72vh * var(--ar)),900px);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sn-board img{display:block;width:100%;height:auto;border-radius:10px;pointer-events:none}
.sn-board.pickable{cursor:crosshair;outline:4px dashed var(--c-cross);outline-offset:3px;border-radius:10px}
.sn-tok{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;transition:left .3s ease-out,top .3s ease-out,opacity .2s;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.sn-tok.slide{transition:left 1.1s ease-in-out,top 1.1s ease-in-out}
.sn-tok.off{opacity:0}
.sn-tok img,.sn-tok span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;border:3px solid #fff;font:800 clamp(12px,2vw,22px)/1 "Baloo 2",sans-serif;color:#fff}
.sn-tok.now img,.sn-tok.now span{border-color:#ffd23f;box-shadow:0 0 0 3px #1b1b1b}
.sn-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sn-chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:700 16px/1 "Atkinson Hyperlegible",sans-serif;color:var(--ink);cursor:pointer}
.sn-chip.now{border-color:var(--c-cross);box-shadow:0 0 0 2px var(--c-cross)}
.sn-chip.fix{outline:3px dashed var(--amber)}
.sn-chip .th{width:34px;height:34px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font:800 16px "Baloo 2",sans-serif}
.sn-chip .th img{width:100%;height:100%;object-fit:cover}
.sn-dice{display:flex;gap:14px;justify-content:center;min-height:72px;position:relative}
.sn-dot{position:absolute;right:-14px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.35}
.die{width:64px;height:64px;border-radius:14px;background:#fff;border:3px solid #1b1b1b;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.die i{border-radius:50%} .die i.on{background:#1b1b1b}
.die.spin{animation:dieshake .14s infinite}
@keyframes dieshake{0%{transform:rotate(-12deg) translateY(-3px)}50%{transform:rotate(10deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.die.spin{animation:none}.sn-tok{transition:none}}
.sn-prev{position:relative;width:100%;max-width:560px;margin-top:8px}
.sn-prev img{display:block;width:100%;border-radius:8px}
.sn-prev .num{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 "Atkinson Hyperlegible",sans-serif;background:rgba(255,255,255,.85);color:#000;border-radius:4px;padding:1px 3px}
.sn-prev svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sn-players .row{align-items:center;margin:6px 0}
.sn-players .th{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font:800 18px "Baloo 2",sans-serif;flex:none}
.sn-players .th img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.lpts{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--soft);font:800 clamp(22px,3.4vw,30px)/1 "Baloo 2",sans-serif;color:var(--ink);margin:4px 0 8px}
.lpts small{font:700 14px/1 "Atkinson Hyperlegible",sans-serif;color:var(--muted)}
.bar .lp{font:800 17px/1 "Baloo 2",sans-serif;white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--soft)}

.hwtag{display:inline-block;font-size:13px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--c-quiz);color:#fff;vertical-align:1px}
.inprog{margin-top:6px;font-size:15px;font-weight:700;color:var(--c-quiz)}
/* higher or lower */
.hl-row{display:flex;gap:clamp(12px,3vw,28px);justify-content:center;align-items:center;flex-wrap:wrap}
.hl-chain{display:flex;align-items:center}
.hl-mini{width:clamp(54px,8vw,74px);margin-right:-18px}
.hl-mini .hlc{width:100%}
.hl-mini .hlc .cn{font-size:clamp(12px,1.8vw,16px)} .hl-mini .hlc .ctr{font-size:clamp(26px,4vw,38px)} .hl-mini .hlc .ctr.court{font-size:clamp(22px,3.4vw,32px)}
.hl-chain + .hlc{margin-left:26px}
.hl-arrow{font:800 clamp(28px,5vw,44px)/1 "Baloo 2",sans-serif;color:var(--muted)}
.hlc{width:clamp(120px,22vw,190px);aspect-ratio:5/7;perspective:900px;position:relative}
.hlc .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.hlc.down .in{transform:rotateY(180deg)}
.hlc .f,.hlc .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hlc .f{background:#fff;border:2px solid #222;color:#141414;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.hlc .f.red{color:#C8102E}
.hlc .b{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#2B4FA8 0 9px,#3D63C4 9px 18px);border:7px solid #fff;box-shadow:0 0 0 2px #222,0 6px 14px rgba(0,0,0,.25)}
.hlc .cn{position:absolute;font:800 clamp(18px,3vw,28px)/.95 Georgia,"Times New Roman",serif;text-align:center}
.hlc .cn i{display:block;font-style:normal;font-size:.85em}
.hlc .tl{top:8px;left:9px} .hlc .br{bottom:8px;right:9px;transform:rotate(180deg)}
.hlc .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:400 clamp(54px,10vw,96px)/1 Georgia,serif}
.hlc .ctr.court{font:700 clamp(46px,8vw,78px)/1 Georgia,serif}
.hlc .ctr.court span{display:block;font-size:.55em;margin-top:4px}
.hlc .ctr.court b{display:block;width:62%;margin:0 auto;border:3px double currentColor;border-radius:10px;padding:8px 0}
.hl-calls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hl-left{font:600 15px/1 "Atkinson Hyperlegible",sans-serif;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hlc .in{transition:none}}

/* landscape tablet: hangman and snakes & ladders fit on one screen */
.hm-side,.hm-main,.sn-side{display:contents}
.hm-side>*{order:3} .hm-main>*{order:4} .hm-main>.score{order:1} .hm-main>.progress{order:2}
.sn-wrap>.sn-board{order:3} .sn-side>*{order:4} .sn-side>.sn-bar{order:1} .sn-side>.sn-bar+*{order:2}
@media (orientation:landscape) and (min-width:700px) and (max-height:1000px){
  .stage{padding-top:12px;padding-bottom:16px}
  .lasttime{margin-bottom:2px}
  .hm{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;justify-items:center;gap:12px 36px}
  .hm-side{display:flex;justify-content:center;align-items:center;max-width:230px}
  .hm-main{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
  .hm .score .n{font-size:40px}
  .hm .hmlives,.hm .balloons{min-height:0}
  .hm .gallows{width:min(26vw,48vh,230px)}
  .hm .slot{height:clamp(44px,9vh,70px);font-size:clamp(32px,7vh,54px)}
  .hm .keys{grid-template-columns:repeat(13,minmax(0,1fr));max-width:860px;gap:6px}
  .hm .key{min-height:clamp(44px,7.5vh,58px);font-size:24px}
  .sn-wrap{flex-direction:row;align-items:center;justify-content:center;gap:24px}
  .sn-board{flex:none;width:min(calc((100vh - 120px) * var(--ar)),calc(100vw - 340px),1100px);width:min(calc((100dvh - 120px) * var(--ar)),calc(100vw - 340px),1100px)}
  .sn-side{display:flex;flex-direction:column;align-items:center;gap:14px;width:260px;flex:none}
  .sn-side .sn-bar{flex-direction:column;align-items:stretch}
}

/* sentence builder · spot the error · odd one out · story dice · phonics sort */
.score .n.bd{color:var(--c-build)} .score .n.se{color:var(--c-spot)} .score .n.od{color:var(--c-odd)} .score .n.sd{color:var(--c-dice)} .score .n.ph{color:var(--c-phon)}
.bd-hint{font:700 clamp(18px,2.6vw,22px)/1.3 "Atkinson Hyperlegible",sans-serif;color:var(--muted)}
.bd-line{min-height:72px;width:min(96vw,900px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-radius:16px;border:3px dashed var(--line);background:var(--surface)}
.bd-line.done{border-style:solid;border-color:var(--c-build);font:800 clamp(24px,4vw,36px)/1.25 "Baloo 2",sans-serif;padding:14px 18px}
.bd-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(96vw,900px)}
.bd-tile{border:0;border-radius:12px;background:var(--c-build);color:#fff;font:800 clamp(20px,3.4vw,30px)/1.1 "Baloo 2",sans-serif;padding:10px 16px;min-height:54px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.bd-tile.placed{background:var(--surface);color:var(--ink);border:3px solid var(--c-build);box-shadow:none}
.bd-tile.placed.ok{border-color:var(--ok);color:var(--ok)} .bd-tile.placed.no{border-color:var(--no);color:var(--no)}
.bd-tile.gone{visibility:hidden}
.se-sent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
.se-w{border:3px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:800 clamp(22px,3.8vw,34px)/1.15 "Baloo 2",sans-serif;padding:8px 14px;min-height:54px;cursor:pointer;touch-action:manipulation}
span.se-w{cursor:default}
.se-w.no{border-color:var(--no);color:var(--no);text-decoration:line-through}
.se-w.hit{border-color:var(--c-spot);background:var(--c-spot);color:#fff}
.se-key{font-size:17px;max-width:560px} .se-key summary{cursor:pointer}
.se-fix{font:700 clamp(20px,3vw,26px)/1.3 "Atkinson Hyperlegible",sans-serif;color:var(--ok);max-width:40ch}

/* ---------- storage adapters ---------- */
function dbStore(db){
  var queues = {};
  function q(path, fn){ var p = (queues[path] || Promise.resolve()).then(fn, fn); queues[path] = p.catch(function(){}); return p; }
  function rows(s){ return s.docs.map(function(d){ var o = clone(d.data() || {}); o.id = d.id; return o; }); }
  return {
    kind: "account",
    watchPacks: function(cb, err){ return db.collection("packs").orderBy("updatedAt", "desc").limit(400).onSnapshot(function(s){ cb(rows(s), s.metadata.fromCache); }, err); },
    watchResults: function(cb, err){ return db.collection("results").orderBy("at", "desc").limit(1000).onSnapshot(function(s){ cb(rows(s), s.metadata.fromCache); }, err); },
    savePack: function(p){ return q("packs/" + p.id, function(){ return db.doc("packs/" + p.id).set(clone(p)); }); },
    deletePack: function(id){ return q("packs/" + id, function(){ return db.doc("packs/" + id).delete(); }); },
    saveResult: function(r){ return q("results/" + r.id, function(){ return db.doc("results/" + r.id).set(clone(r)); }); },
    deleteResult: function(id){ return q("results/" + id, function(){ return db.doc("results/" + id).delete(); }); },
    watchStudents: function(cb, err){ return db.collection("students").limit(200).onSnapshot(function(s){ cb(rows(s), s.metadata.fromCache); }, err); },
    saveStudent: function(o){ return q("students/" + o.id, function(){ return db.doc("students/" + o.id).set(clone(o)); }); },
    watchBoards: function(cb, err){ return db.collection("boards").limit(50).onSnapshot(function(s){ cb(rows(s), s.metadata.fromCache); }, err); },
    saveBoard: function(o){ return q("boards/" + o.id, function(){ return db.doc("boards/" + o.id).set(clone(o)); }); },
    watchSheets: function(cb, err){ return db.collection("sheets").orderBy("updatedAt", "desc").limit(300).onSnapshot(function(s){ cb(rows(s), s.metadata.fromCache); }, err); },
    saveSheet: function(o){ return q("sheets/" + o.id, function(){ return db.doc("sheets/" + o.id).set(clone(o)); }); },
    watchPhaseb: function(cb, err){ return db.collection("phaseb").limit(5000).onSnapshot(function(s){ cb(rows(s).map(function(o){ o.pack_id = o.pack_id || o.id; delete o.id; return o; })); }, err); },
    savePhaseb: function(list){ return Promise.all(list.map(function(r){ return q("phaseb/" + r.pack_id, function(){ return db.doc("phaseb/" + r.pack_id).set(clone(r)); }); })); },
    deletePhaseb: function(ids){ return Promise.all(ids.map(function(id){ return q("phaseb/" + id, function(){ return db.doc("phaseb/" + id).delete(); }); })); }
  };
}
/* Supabase (GitHub Pages build): one table per collection, rows are { id, data jsonb, updated_at }.
   watch* = initial select + Realtime changes; refetches on reconnect and when the tab comes back. */
function supabaseStore(sb){
  var queues = {}, cache = {}, subs = {}, errs = {}, chan = null;
  var ORDER = { packs:"updatedAt", results:"at", sheets:"updatedAt" };
  var LIMIT = { packs:400, results:1000, students:200, boards:50, sheets:300 };
  function q(path, fn){ var p = (queues[path] || Promise.resolve()).then(fn, fn); queues[path] = p.catch(function(){}); return p; }
  function ok(r){ if(r && r.error) throw r.error; return r; }
  function row(r){ var o = clone(r.data || {}); o.id = r.id; return o; }
  function emit(t){
    if(!cache[t] || !subs[t]) return;
    var o = ORDER[t], list = Object.keys(cache[t]).map(function(k){ return clone(cache[t][k]); });
    if(o) list.sort(function(a, b){ return String(b[o] || "").localeCompare(String(a[o] || "")); });
    list = list.slice(0, LIMIT[t]);
    subs[t].forEach(function(f){ f(list, false); });
  }
  function load(t){
    var qy = sb.from(t).select("id,data");
    if(ORDER[t]) qy = qy.order("data->>" + ORDER[t], { ascending:false });
    return qy.limit(LIMIT[t]).then(function(r){
      if(r.error){ (errs[t] || []).forEach(function(f){ f(r.error); }); return; }
      var c = {}; r.data.forEach(function(x){ c[x.id] = row(x); }); cache[t] = c; emit(t);
    });
  }
  function loadAll(){ Object.keys(subs).forEach(load); if(pb.subs.length) pbLoad(); }
  /* phaseb (Phase B done / not needed, one row per pack): its own columns, keyed by pack_id, not { id, data }. */
  var pb = { cache:null, subs:[] };
  function pbEmit(){ if(!pb.cache) return; var list = Object.keys(pb.cache).map(function(k){ return clone(pb.cache[k]); }); pb.subs.forEach(function(f){ f(list); }); }
  function pbLoad(){ return sb.from("phaseb").select("pack_id,status,at,by,note").limit(5000).then(function(r){ if(r.error) return; var c = {}; (r.data || []).forEach(function(x){ c[x.pack_id] = x; }); pb.cache = c; pbEmit(); }); }
  function pbChange(p){
    if(!pb.cache) return;
    if(p.eventType === "DELETE"){ var id = p.old && p.old.pack_id; if(id){ delete pb.cache[id]; pbEmit(); } return; }
    var n = p.new || {}; if(!n.pack_id) return;
    pb.cache[n.pack_id] = { pack_id:n.pack_id, status:n.status, at:n.at, by:n.by, note:n.note == null ? null : n.note }; pbEmit();
  }
  function change(t, p){
    if(!cache[t]) return;
    if(p.eventType === "DELETE"){ var id = p.old && p.old.id; if(id){ delete cache[t][id]; emit(t); } return; }
    var n = p.new || {};
    if(!n.id) return;
    if(n.data == null){ sb.from(t).select("id,data").eq("id", n.id).maybeSingle().then(function(r){ if(r.data){ cache[t][r.data.id] = row(r.data); emit(t); } }); return; }
    cache[t][n.id] = row(n); emit(t);
  }
  function ensureChannel(){
    if(chan) return;
    chan = sb.channel("lesson-games");
    ["packs", "results", "students", "boards", "sheets"].forEach(function(t){
      chan = chan.on("postgres_changes", { event:"*", schema:"public", table:t }, function(p){ change(t, p); });
    });
    chan = chan.on("postgres_changes", { event:"*", schema:"public", table:"phaseb" }, pbChange);
    var first = true;
    chan.subscribe(function(st){ if(st === "SUBSCRIBED"){ if(!first) loadAll(); first = false; } });
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) loadAll(); });
  window.addEventListener("online", loadAll);
  function watch(t){ return function(cb, err){
    (subs[t] = subs[t] || []).push(cb); (errs[t] = errs[t] || []).push(err || function(){});
    ensureChannel();
    if(cache[t]) setTimeout(function(){ emit(t); }, 0); else load(t);
    return function(){ subs[t] = subs[t].filter(function(f){ return f !== cb; }); };
  }; }
  function save(t){ return function(o){
    var d = clone(o); if(cache[t]){ cache[t][o.id] = clone(o); emit(t); }
    return q(t + "/" + o.id, function(){ return sb.from(t).upsert({ id:o.id, data:d }).then(ok); });
  }; }
  function del(t){ return function(id){
    if(cache[t]){ delete cache[t][id]; emit(t); }
    return q(t + "/" + id, function(){ return sb.from(t).delete().eq("id", id).then(ok); });
  }; }
  return {
    kind: "supabase",
    watchPacks: watch("packs"), savePack: save("packs"), deletePack: del("packs"),
    watchResults: watch("results"), saveResult: save("results"), deleteResult: del("results"),
    watchStudents: watch("students"), saveStudent: save("students"),
    watchBoards: watch("boards"), saveBoard: save("boards"),
    watchSheets: watch("sheets"), saveSheet: save("sheets"),
    watchPhaseb: function(cb){ pb.subs.push(cb); ensureChannel(); if(pb.cache) setTimeout(pbEmit, 0); else pbLoad(); return function(){ pb.subs = pb.subs.filter(function(f){ return f !== cb; }); }; },
    savePhaseb: function(list){
      if(pb.cache){ list.forEach(function(r){ pb.cache[r.pack_id] = clone(r); }); pbEmit(); }
      var chunks = []; for(var i = 0; i < list.length; i += 100) chunks.push(list.slice(i, i + 100));
      return chunks.reduce(function(p, ch){ return p.then(function(){ return sb.from("phaseb").upsert(ch, { onConflict:"pack_id" }).then(ok); }); }, Promise.resolve())
        .catch(function(e){ pbLoad(); throw e; });
    },
    deletePhaseb: function(ids){
      if(pb.cache){ ids.forEach(function(id){ delete pb.cache[id]; }); pbEmit(); }
      return sb.from("phaseb").delete().in("pack_id", ids).then(ok).catch(function(e){ pbLoad(); throw e; });
    },
    /* restore a backup: upserts in batches, returns counts written per collection */
    restore: function(cols){
      var names = ["packs", "results", "students", "boards", "sheets"], done = {};
      return names.reduce(function(p, t){
        return p.then(function(){
          var rows = (cols[t] || []).filter(function(o){ return o && o.id; }).map(function(o){ var d = clone(o); return { id:String(o.id), data:d }; });
          done[t] = 0;
          var chunks = []; for(var i = 0; i < rows.length; i += 20) chunks.push(rows.slice(i, i + 20));
          return chunks.reduce(function(pp, ch){ return pp.then(function(){ return sb.from(t).upsert(ch).then(ok).then(function(){ done[t] += ch.length; }); }); }, Promise.resolve());
        });
      }, Promise.resolve()).then(function(){
        var pr = (cols.phaseb || []).filter(function(o){ return o && o.pack_id && (o.status === "done" || o.status === "skip"); })
          .map(function(o){ return { pack_id:String(o.pack_id), status:o.status, at:o.at || nowIso(), by:o.by === "chat" ? "chat" : "manual", note:o.note == null ? null : String(o.note) }; });
        if(pr.length) done.phaseb = pr.length;
        return pr.length ? sb.from("phaseb").upsert(pr, { onConflict:"pack_id" }).then(ok) : null;
      }).then(function(){ loadAll(); return done; });
    }
  };
}
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function localStore(){
  var KEY = "lessonGames.data.v2";

  if(!data.students) data.students = {};
  if(!data.boards) data.boards = {};
  if(!data.sheets) data.sheets = {};
  if(!data.phaseb) data.phaseb = {};
  var L = { packs:[], results:[], students:[], boards:[], sheets:[], phaseb:[] };
  function emit(){
    saveLocal(KEY, data);
    var p = Object.keys(data.packs).map(function(k){ return clone(data.packs[k]); }).sort(function(a,b){ return String(b.updatedAt).localeCompare(String(a.updatedAt)); });
    var r = Object.keys(data.results).map(function(k){ return clone(data.results[k]); }).sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); });
    L.packs.forEach(function(f){ f(p, false); }); L.results.forEach(function(f){ f(r, false); });
    var st = Object.keys(data.students).map(function(k){ return clone(data.students[k]); });
    L.students.forEach(function(f){ f(st, false); });
    var bd = Object.keys(data.boards).map(function(k){ return clone(data.boards[k]); });
    L.boards.forEach(function(f){ f(bd, false); });
    var sh = Object.keys(data.sheets).map(function(k){ return clone(data.sheets[k]); });
    L.sheets.forEach(function(f){ f(sh, false); });
    var pbl = Object.keys(data.phaseb).map(function(k){ return clone(data.phaseb[k]); });
    L.phaseb.forEach(function(f){ f(pbl); });
  }
  return {
    kind: "local",
    watchPacks: function(cb){ L.packs.push(cb); setTimeout(emit, 0); return function(){}; },
    watchResults: function(cb){ L.results.push(cb); setTimeout(emit, 0); return function(){}; },
    savePack: function(p){ data.packs[p.id] = clone(p); emit(); return Promise.resolve(); },
    deletePack: function(id){ delete data.packs[id]; emit(); return Promise.resolve(); },
    saveResult: function(r){ data.results[r.id] = clone(r); emit(); return Promise.resolve(); },
    deleteResult: function(id){ delete data.results[id]; emit(); return Promise.resolve(); },
    watchStudents: function(cb){ L.students.push(cb); setTimeout(emit, 0); return function(){}; },
    saveStudent: function(o){ data.students[o.id] = clone(o); emit(); return Promise.resolve(); },
    watchBoards: function(cb){ L.boards.push(cb); setTimeout(emit, 0); return function(){}; },
    saveBoard: function(o){ data.boards[o.id] = clone(o); emit(); return Promise.resolve(); },
    watchSheets: function(cb){ L.sheets.push(cb); setTimeout(emit, 0); return function(){}; },
    saveSheet: function(o){ data.sheets[o.id] = clone(o); emit(); return Promise.resolve(); },
    watchPhaseb: function(cb){ L.phaseb.push(cb); setTimeout(emit, 0); return function(){}; },
    savePhaseb: function(list){ list.forEach(function(r){ data.phaseb[r.pack_id] = clone(r); }); emit(); return Promise.resolve(); },
    deletePhaseb: function(ids){ ids.forEach(function(id){ delete data.phaseb[id]; }); emit(); return Promise.resolve(); }
  };
}

async function connect(){

}
async function connectSupabase(){
  try{ if(!window.supabase) await loadScript("supabase.js"); }catch(e){ STATUS = "error"; refresh(); return; }
  SB = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"lessonGames.auth" } });
  SB.auth.onAuthStateChange(function(ev, session){
    if(ev === "SIGNED_OUT"){ AUTH.need = true; AUTH.sent = ""; render(); }
    else if(session && AUTH.need) setTimeout(function(){ afterSignIn(session); }, 0);
  });
  var r = await SB.auth.getSession();
  if(/access_token=|error_description=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
  if(r.data && r.data.session) return afterSignIn(r.data.session);
  AUTH.need = true; render();
}
async function afterSignIn(session){
  if(STORE && STORE.kind === "supabase" && !AUTH.need) return;
  AUTH.email = (session.user && session.user.email) || "";
  var t = await SB.rpc("am_i_teacher");
  if(t.error || t.data !== true){ AUTH.need = true; AUTH.notTeacher = !t.error; AUTH.err = t.error ? "Couldn’t check the account. Check the connection and reload." : ""; render(); return; }
  AUTH.need = false; AUTH.notTeacher = false; AUTH.err = "";
  if(STORE && STORE.kind === "supabase"){ render(); return; }
  startStore(supabaseStore(SB), "account");
}
function startStore(store, status){
  STORE = store;
  STATUS = status;
  var timer = setTimeout(function(){ SLOW = true; refresh(); }, 10000);
  function done(cache){ if(!cache){ clearTimeout(timer); SLOW = false; } }
  STORE.watchPacks(function(list, cache){ PACKS = list; LOADED.packs = true; done(cache); refresh(); }, function(e){ STATUS = "error"; clearTimeout(timer); refresh(); });
  STORE.watchResults(function(list, cache){ RESULTS = list; LOADED.results = true; done(cache); refresh(); }, function(e){ STATUS = "error"; clearTimeout(timer); refresh(); });
  STORE.watchStudents(function(list){ STUDENTS = {}; list.forEach(function(o){ STUDENTS[o.id] = o; }); refresh(); }, function(){});
  STORE.watchBoards(function(list){ BOARDS = {}; list.forEach(function(o){ BOARDS[o.id] = o; }); refresh(); }, function(){});
  STORE.watchSheets(function(list){ SHEETS = {}; list.forEach(function(o){ SHEETS[o.id] = o; }); LOADED.sheets = true; refresh(); }, function(){});
  if(STORE.watchPhaseb) STORE.watchPhaseb(function(list){ PHASEB = {}; list.forEach(function(o){ PHASEB[o.pack_id] = o; }); LOADED.phaseb = true; refresh(); }, function(){});
  refresh();
}
var LIVE_VIEWS = ["home", "pack", "student", "done", "sheet", "phaseb"];

  /* Game screens don't redraw on data changes, except while the loading screen is still up (a reload mid-game). */
  if(LIVE_VIEWS.indexOf(UI.view) !== -1 || $("loadingView")) render();
  else { var s = $("status"); if(s) s.outerHTML = statusPill(); try{ liveSync(); livePaint(); }catch(e){} }
}
function statusPill(){
  if(STATUS === "connecting" || (STATUS === "account" && !LOADED.packs)) return '<span class="pill" id="status"><i></i>' + (SLOW ? "Can’t reach your saved games yet" : "Connecting…") + '</span>';
  if(STATUS === "account") return '<span class="pill ok" id="status"><i></i>' + (SLOW ? "Saved games may be out of date" : (SB_MODE ? "Saved online" : "Saved to your account")) + '</span>';

function getPack(id){ return PACKS.filter(function(p){ return p.id === id; })[0] || null; }
function resultsFor(packId, gameId){ return RESULTS.filter(function(r){ return r.packId === packId && (!gameId || r.gameId === gameId); }); }

function parseLines(text){

    .filter(function(l){ return l && !/^```/.test(l); })
    .map(function(l){ return l.replace(/^[-•*]\s+/, ""); });
}
/* "word = definition" (bingo) */

    var w = line, d = "", m = line.match(/^(.+?)\s*=\s*(.+)$/);

    out.push({ w:w, d:d });

}

function parseTaboo(text){
  var cards = [], cur = null;
  parseLines(text).forEach(function(l){
    var m = l.match(/^(target|word)\s*[:：]\s*(.+)$/i);
    if(m){ cur = { t:m[2].trim(), f:[] }; cards.push(cur); return; }
    m = l.match(/^(forbidden|taboo)\s*[:：]\s*(.+)$/i);
    if(m && cur) cur.f = cur.f.concat(m[2].split(/\s*[,，、|\/]\s*/).map(function(x){ return x.trim(); }).filter(Boolean));
  });
  return cards;
}

/* As in LP_skeleton's GRAMMAR AUCTION block: "1. sentence [CORRECT]" / "2. sentence [WRONG — correction]".

function parseAuction(text){
  var out = [];
  parseLines(text).forEach(function(l){
    l = l.replace(/^\(?\d+\s*[.)、．]\s*/, "").trim();
    if(!l || /^grammar auction\b/i.test(l)) return;
    var m = l.match(/^(.*?)\s*[\[【［]\s*(correct|right|ok|wrong|incorrect)\s*(?:[—–\-:：]+\s*(.*?))?\s*[\]】］]\s*$/i);
    if(m){ var bad = /^(wrong|incorrect)$/i.test(m[2]); out.push({ s:m[1].trim(), ok:!bad, fix: bad ? (m[3] || "").trim().replace(/^[^:：]{0,30}trap\s*[:：]\s*/i, "") : "" }); return; }
    m = l.match(/^(.+?)\s*=>\s*(.+)$/);
    if(m){ out.push({ s:m[1].trim(), ok:false, fix:m[2].trim() }); return; }
    out.push({ s:l, ok:null, fix:"" });

  },
  score: function(run){ var R = qSummaryRows(run.st), f = R.filter(function(r){ return r.first; }).length; return { total:f, max:R.length, text: f + "/" + R.length + " right first time" }; },
  items: function(run){

    });
  }
};

function b64u(bytes){ var t = ""; for(var i=0;i<bytes.length;i+=0x8000) t += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

async function packData(obj){
  var raw = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream === "function"){ try{ return "z" + b64u(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer())); }catch(e){} }
  return "u" + b64u(raw);

async function unpackData(t){
  var b = unb64u(t.slice(1));
  if(t[0] === "z") b = new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(b));

/* Snakes & Ladders links: the board and token pictures are too big for a link, so they go in the public
   "game-pictures" folder (Supabase storage; it can't be listed) and the link carries their addresses. */
var PIC_URLS = {};
function picUrl(dataUrl){
  var m = /^data:(image\/[a-z+.-]+);base64,(.*)$/i.exec(String(dataUrl || ""));
  if(!m) return Promise.resolve(dataUrl || "");
  if(PIC_URLS[dataUrl]) return Promise.resolve(PIC_URLS[dataUrl]);
  if(!SB || !window.crypto || !crypto.subtle) return Promise.reject(new Error("pictures can only be shared from the online app"));
  var type = m[1].toLowerCase(), bin = atob(m[2]), bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var ext = type === "image/png" ? "png" : type === "image/webp" ? "webp" : type === "image/gif" ? "gif" : "jpg";
  return crypto.subtle.digest("SHA-256", bytes).then(function(h){
    var hex = Array.prototype.map.call(new Uint8Array(h), function(x){ return ("0" + x.toString(16)).slice(-2); }).join("").slice(0, 32);
    var path = hex + "." + ext, bucket = SB.storage.from("game-pictures");
    return bucket.upload(path, new Blob([bytes], { type:type }), { upsert:true, contentType:type, cacheControl:"31536000" }).then(function(r){
      if(r.error) throw r.error;
      var u = bucket.getPublicUrl(path).data.publicUrl; PIC_URLS[dataUrl] = u; return u;
    });
  });
}

  }

    end("failed", /bad_link/.test(m) ? "link" : /too_many/.test(m) ? "many" : /too_big|bad_result/.test(m) ? "big" : "net");
  });
}

function makeSCode(r){

async function importStudentResult(text){

    title:(d.n || g.title || "") + " (own device)", at:d.a || nowIso(), summary:String(d.s || "").replace(/^([^—]*?) — /, "$1 (own device) — "), score:d.sc || null, items:d.it || [], activeSecs:d.sec || 0, online:true, points: d.pt != null ? d.pt : gamePoints(d.t, null, d.sc) };
