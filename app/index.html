/* ---------- lesson points: each game's best play, added up ---------- */
/* Games with their own points keep them (Quiz, Hangman, Grammar Auction, Sentence Builder, Spot the Error, Odd One Out); Whack-a-Mole's
   1 point per hit counts as 100; everything else is 100 per right answer; Snakes & Ladders adds none. */
function gamePoints(type, st, sc){
  st = st || {};
  if(type === "quiz") return Math.max(0, st.score != null ? st.score : (sc && sc.total) || 0);
  if(type === "auction") return Math.max(0, st.bank != null ? st.bank : (sc && sc.total) || 0);
  if((type === "hangman" || type === "anagrams") && st.points != null && st.total != null) return Math.max(0, st.total);
  if(type === "whack") return Math.max(0, (st.score != null ? st.score : (sc && sc.total) || 0) * 100);
  if((type === "build" || type === "spot" || type === "odd") && st.pts != null) return Math.max(0, st.pts);
  if(type === "snakes" || type === "hilo") return 0;
  return Math.max(0, ((sc && sc.total) || 0) * 100);
}
function resultPoints(r){ return r.points != null ? r.points : gamePoints(r.type, r.detail, r.score); }
function lessonPoints(packId, live){
  var best = {};
  RESULTS.forEach(function(r){ if(r.packId !== packId) return; var v = resultPoints(r); if(best[r.gameId] == null || v > best[r.gameId]) best[r.gameId] = v; });
  if(live && (best[live.gameId] == null || live.points > best[live.gameId])) best[live.gameId] = live.points;
  return Object.keys(best).reduce(function(a, k){ return a + best[k]; }, 0);
}
function fmtPts(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* =====================================================================
   RUN SHEET — the paper run sheet on screen (Run_Sheet_template.md; spec = rs_build.py's JSON).
   packs/<id>.runsheet  the rs_build spec, saved by the planning chat at Gate 5 (app lines may carry
                        "game": "g2"). The paper PDF is built from the same spec.
   sheets/<packId>      { id, packId, student, lp, date, updatedAt, marks {key: value}, finished, finishedAt,
                          rows [ {block, type, label, mark} ], gaps [labels], summary (plain text) }
   Marks: "y" ran / "n" didn't run / missing = not marked (asked at Phase B). Keys come from the block label
   and the line's own text, so a re-saved plan keeps the marks on lines that didn't change.
   students/<slug>.runsheet  no longer read (was "online" | "always"); every lesson with a run sheet opens on it.
   ===================================================================== */
var SHEETS = {}, RS_LOCAL = {}, RS_DIRTY = {}, RS_TIMER = null, RS_SAVING = 0, RS_PEND = false, RS_TICK = null;
var RS_PLAN = ["no", "too long", "instructions", "level", "materials"];

/* An online lesson: the run sheet's format says so, or a class link is connected, or this is the student's own device.
   Quiz "Say it first" starts off there (answers would be on the student's screen anyway); Settings can turn it on. */
function lessonOnline(p){ return !!(SMODE || rsOnline(rsSpec(p)) || (LIVE.cls && LIVE.peers > 0)); }
function rsSpec(p){ return p && p.runsheet && Array.isArray(p.runsheet.blocks) && p.runsheet.blocks.length ? p.runsheet : null; }
function rsOnline(spec){ return /online/i.test(String(spec && spec.format || "")); }
/* Every lesson with a run sheet opens on it, online or in person (Nov 2026: paper only on request, from the planning chat). */
function rsOn(p){ return !!rsSpec(p); }
function rsHm(t){ var m = /^(\d{1,2}):(\d{2})/.exec(String(t || "")); return m ? +m[1] * 60 + +m[2] : null; }
function rsFmt(n){ n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0"); }
function rsNow(){ var d = new Date(); return rsFmt(d.getHours() * 60 + d.getMinutes()); }
function rsGroup(spec){ return spec.group && spec.group.length ? spec.group.map(String) : [""]; }
function rsPer(k, s){ return k + (s ? "@" + s : ""); }
function rsLineText(ln){ return String(ln.label || ln.text || ln.spring || ln.tag || (ln.words || []).join(",") || (ln.items || []).join(",") || ""); }
function rsLayout(spec){
  var t = rsHm(spec.start) || 0, seen = {};
  return spec.blocks.map(function(b, bi){
    var bk = "b" + hash(String(b.label || bi)).toString(36);
    if(seen[bk]) bk += "_" + bi; seen[bk] = 1;
    var cnt = {};
    /* A step cue and the app game for the same step are one thing: the cue's text goes onto the game's row and the
       cue's own tick box goes. Same step code ("2A The auction" + "2A Evidence Auction"), or a cue straight before an
       app game with no code that shares a word with it ("2A Hangman" + "Batch 18 Hangman"; the row then shows "2A"). */
    function code(l){ var m = /^(\d+[A-Za-z])\b/.exec(String(l || "")); return m ? m[1].toUpperCase() : ""; }
    function words(l){ return String(l || "").replace(/^\d+[A-Za-z]\b/, "").toLowerCase().match(/[a-z0-9]{3,}/g) || []; }
    var appBy = {}, all = (b.lines || []).map(function(ln){ return Object.assign({}, ln); }); /* copies: the plan itself isn't changed */
    all.forEach(function(ln){ if(ln.type === "app" && code(ln.label) && !appBy[code(ln.label)]) appBy[code(ln.label)] = ln; });
    var src = [];
    all.forEach(function(ln, i){
      var c = ln.type === "cue" && !ln.nobox ? code(ln.label) : "", a = c && appBy[c], nx = all[i + 1];
      if(!a && ln.type === "cue" && !ln.nobox && nx && nx.type === "app" && !code(nx.label) && !nx._code){
        var aw = words(nx.label);
        if(words(ln.label).some(function(w){ return aw.indexOf(w) !== -1; })){ a = nx; if(c) a._code = c; }
      }
      if(a){
        var aw2 = words(a.label), title = String(ln.label || "").replace(/^\d+[A-Za-z]\s*/, "");
        if(words(ln.label).every(function(w){ return aw2.indexOf(w) !== -1; })) title = "";
        a._note = (a._note ? a._note + " · " : "") + [title, ln.text].filter(Boolean).join(": ");
        return;
      }
      src.push(ln);
    });
    var lines = src.map(function(ln){
      var base = bk + "." + (ln.type || "x") + "." + hash(rsLineText(ln)).toString(36);
      var n = cnt[base] = (cnt[base] || 0) + 1;
      return { key: n > 1 ? base + "_" + n : base, ln: ln };
    });
    var o = { key: bk, label: String(b.label || ""), material: String(b.material || ""), mins: +b.mins || 0, start: t, lines: lines };
    t += o.mins; return o;
  });
}
function rsEnd(spec){ var t = rsHm(spec.start) || 0; spec.blocks.forEach(function(b){ t += +b.mins || 0; }); return t; }

/* working copy: the saved doc, or local edits not yet saved */
function rsDoc(pid){
  if(!RS_DIRTY[pid] || !RS_LOCAL[pid]){ var s = SHEETS[pid]; RS_LOCAL[pid] = s ? clone(s) : { id: pid, packId: pid, marks: {} }; if(!RS_LOCAL[pid].marks) RS_LOCAL[pid].marks = {}; }
  return RS_LOCAL[pid];
}
function rsGet(pid, k){ var v = rsDoc(pid).marks[k]; return v == null ? "" : v; }
function rsSet(pid, k, v){
  var d = rsDoc(pid);
  if(v == null || (typeof v === "string" && !v.trim()) || (Array.isArray(v) && !v.length)) delete d.marks[k]; else d.marks[k] = v;
  RS_DIRTY[pid] = true; clearTimeout(RS_TIMER); RS_TIMER = setTimeout(function(){ rsFlush(pid); }, 700); rsPaintState();
}
function rsFlush(pid){
  clearTimeout(RS_TIMER); RS_TIMER = null;
  var p = getPack(pid);
  if(!RS_DIRTY[pid] || !p || !rsSpec(p) || !STORE) return Promise.resolve();
  var out = rsBuildDoc(p, rsDoc(pid)); delete out._gapKeys;
  RS_DIRTY[pid] = false; RS_SAVING++; SHEETS[pid] = clone(out); RS_LOCAL[pid] = clone(out); rsPaintState();
  return STORE.saveSheet(out).then(function(){ RS_SAVING--; rsPaintState(); }, function(e){ RS_SAVING--; RS_DIRTY[pid] = true; rsPaintState(); saveErr(e); });
}
function rsFlushAll(){ Object.keys(RS_DIRTY).forEach(function(pid){ if(RS_DIRTY[pid]) rsFlush(pid); }); }

/* which game an app line is, and its newest result */
function rsTitleKey(s){ return itemKey(s).replace(/\s*\((misses|challenge|hard mode|on the spot)\)$/i, "").replace(/^\d+[a-z]?\s+/, ""); }
function rsAppGame(p, ln){
  var gs = p.games || [];
  if(ln.game){ var g = gs.filter(function(x){ return x.id === ln.game; })[0]; if(g) return g; }
  var want = rsTitleKey(ln.label);
  return gs.filter(function(x){ var t = rsTitleKey(x.title || ""); return t && want && (t === want || want.indexOf(t) !== -1 || t.indexOf(want) !== -1); })[0] || null;
}
function rsAppResult(p, ln){
  var g = rsAppGame(p, ln); if(!g) return null;
  return RESULTS.filter(function(r){ return r.packId === p.id && r.gameId === g.id; })[0] || null;
}

/* The reading Phase B gets: rows, the unmarked list and a plain-text summary, from the marks. */
function rsBuildDoc(p, d){
  var spec = rsSpec(p), lay = rsLayout(spec), G = rsGroup(spec), M = d.marks || {};
  function g(k){ var v = M[k]; return v == null ? "" : v; }
  var L = [], rows = [], gaps = [], gapKeys = {};
  function row(block, type, label, mark, unknown, key){ rows.push({ block: block, type: type, label: label, mark: mark }); if(unknown){ gaps.push(label); gapKeys[key] = 1; } }
  function tri(v){ return v === "y" ? "✓ ran" : v === "n" ? "✗ didn’t run" : "(?)"; }
  function who(s){ return s ? s + " " : ""; }
  L.push("RUN SHEET (marked in the app) · " + [spec.student || p.student, "LP" + (spec.lp || p.lp || ""), spec.date || fmtDate(p.date), spec.start, spec.length ? spec.length + " min" : "", spec.format].filter(Boolean).join(" · "));
  if(spec.spine) L.push("Spine: " + spec.spine);
  lay.forEach(function(b){
    var skip = g(b.key + ".skip") === "y", bl = b.label;
    L.push(""); L.push(rsFmt(b.start) + " · " + bl + (b.material ? " · " + b.material : "") + " · " + b.mins + " min" + (skip ? " — SKIPPED (did not run)" : ""));
    if(skip) row(bl, "block", bl, "skipped — did not run", false, b.key);
    b.lines.forEach(function(x){
      var ln = x.ln, k = x.key, t = ln.type, v, txt, lab;
      if(t === "cue"){
        if(ln.nobox) return;
        lab = (ln.label || "step") + (ln.text ? " — " + ln.text : "");
        v = skip ? "n" : g(k); txt = tri(v); L.push("  " + txt + " · " + lab); row(bl, t, lab, txt, !v, k);
      } else if(t === "pages"){
        L.push("  pages: " + (ln.items || []).map(function(it, i){ var pv = skip ? "n" : g(k + ".p" + i); row(bl, "page", it, tri(pv), !pv, k + ".p" + i); return it + " " + (pv === "y" ? "✓" : pv === "n" ? "✗" : "(?)"); }).join(" · "));
      } else if(t === "score"){
        lab = ln.label + " __/" + ln.n + (ln.tag ? " [" + ln.tag + "]" : "") + (ln.trap ? " (trap: item " + ln.trap + ")" : "");
        var nd = skip || g(k + ".x") === "n", blank = false;
        if(nd) txt = "✗ not done";
        else {
          txt = G.map(function(s){ var sv = g(rsPer(k, s)); if(sv === "") blank = true; return who(s) + (sv !== "" ? sv + "/" + ln.n : "[blank]"); }).join(" · ");
          txt += g(k + ".m") ? " — mistakes: " + g(k + ".m") : " — no mistakes written";
        }
        L.push("  " + lab + ": " + txt); row(bl, t, lab, txt, blank && !nd, k);
      } else if(t === "app"){
        var r = rsAppResult(p, ln); v = g(k);
        txt = r ? "played in the app — " + (r.score && r.score.text ? r.score.text : "result saved") + " (see results)" : skip ? "✗ didn’t run" : v === "y" ? "✓ ran (no app result: played outside the app)" : v === "n" ? "✗ didn’t run" : "(?) no app result";
        L.push("  app game · " + (ln._code ? ln._code + " " : "") + ln.label + (ln._note ? " (" + ln._note + ")" : "") + ": " + txt); row(bl, t, ln.label, txt, !r && !skip && !v, k);
      } else if(t === "trap"){
        lab = "TRAP “" + ln.spring + "”";
        var tb = false;
        txt = skip ? "✗ didn’t run" : G.map(function(s){ var tv = g(rsPer(k, s)); if(!tv) tb = true; return who(s) + (tv === "r" ? "right" : tv === "w" ? "wrong" : "(?)"); }).join(" · ");
        L.push("  " + lab + ": " + txt); row(bl, t, lab, txt, tb && !skip, k);
      } else if(t === "judge"){
        lab = "[" + ln.tag + "]";
        var jb = false;
        txt = skip ? "✗ didn’t run" : G.map(function(s){ var jv = g(rsPer(k, s)); if(!jv) jb = true; return who(s) + (jv || "(?)"); }).join(" · ");
        L.push("  judged " + lab + ": " + txt); row(bl, t, lab, txt, jb && !skip, k);
      } else if(t === "clock"){
        v = g(k); txt = skip ? "✗ didn’t run" : v ? "actual " + v : "[blank]";
        L.push("  " + ln.text + ": " + txt); row(bl, t, ln.text, txt, !v && !skip, k);
      } else if(t === "done"){
        var bls = ln.blanks || [], db = false;
        txt = bls.length ? bls.map(function(n, i){ var dv = g(k + ".x" + i); if(!dv) db = true; return n + ": " + (dv || "[blank]"); }).join(" · ") : "";
        L.push("  Done = " + ln.text + (txt ? " · " + txt : "")); if(bls.length) row(bl, t, "Done = " + ln.text, skip ? "✗ didn’t run" : txt, db && !skip, k);
      } else if(t === "words"){
        var circ = Array.isArray(g(k)) ? g(k) : [];
        txt = circ.length ? "stumbled: " + circ.join(", ") : "no stumbles circled";
        L.push("  words (" + (ln.words || []).join(", ") + "): " + txt); row(bl, t, "words", txt, false, k);
      } else if(t === "box"){
        v = skip ? "n" : g(k); txt = v === "y" ? "✓ done" : v === "n" ? "✗ not done" : "(?)";
        L.push("  ☐ " + ln.text + ": " + txt); row(bl, t, ln.text, txt, !v, k);
      } else if(t === "write"){
        v = g(k); L.push("  " + ln.label + ": " + (v || "—")); row(bl, t, ln.label, v || "—", false, k);
      }
    });
  });
  var E = "End";
  L.push(""); L.push("END (planned " + rsFmt(rsEnd(spec)) + ")");
  function endRow(label, key, val, need){ L.push("  " + label + ": " + (val || (need ? "[blank]" : "—"))); row(E, "end", label, val || (need ? "[blank]" : "—"), need && !val, key); }
  endRow("Finished", "end.fin", g("end.fin"), true);
  endRow("Changed in the room", "end.chg", g("end.chg"), false);
  endRow("Spine 1–5", "end.spine", g("end.spine"), true);
  G.forEach(function(s){ endRow("Energy 1–5" + (s ? " · " + s : ""), rsPer("end.energy", s), g(rsPer("end.energy", s)), true); });
  endRow("Plan got in the way?", "end.plan", (Array.isArray(g("end.plan")) ? g("end.plan") : []).join(", "), true);
  (spec.asks || []).forEach(function(a, i){ endRow("Ask · " + a.label, "ask." + i, g("ask." + i), true); });
  endRow("Parent said", "end.parent", g("end.parent"), false);
  endRow("Other mistakes", "end.other", g("end.other"), false);
  L.push(""); L.push(gaps.length ? "UNMARKED — ask at Phase B: " + gaps.join(" · ") : "Everything is marked.");
  return { id: p.id, packId: p.id, student: p.student || spec.student || "", lp: p.lp || spec.lp || null, date: p.date || "", updatedAt: nowIso(),
    marks: clone(M), finished: !!d.finished, finishedAt: d.finishedAt || null, rows: rows, gaps: gaps, summary: L.join("\n"), _gapKeys: gapKeys };
}

/* ---------- screen ---------- */
function rsTick(pid, k, label){
  var v = rsGet(pid, k);
  return '<button class="rs-tk ' + (v === "y" ? "y" : v === "n" ? "n" : "") + '" data-a="rs-tick" data-k="' + esc(k) + '" aria-label="' + esc(label) + ': ' + (v === "y" ? "ran" : v === "n" ? "didn’t run" : "not marked") + '">' + (v === "y" ? "✓" : v === "n" ? "✗" : "") + '</button>';
}
function rsSeg(pid, k, opts, label){

}
function rsIn(pid, k, ph, label){ return '<input type="text" class="rs-in" data-rsin="' + esc(k) + '" value="' + esc(rsGet(pid, k)) + '" placeholder="' + esc(ph || "") + '" aria-label="' + esc(label || ph || "") + '" autocomplete="off">'; }
function rsWho(s){ return s ? '<span class="rs-who">' + esc(s) + '</span>' : ""; }
function rsLine(p, x, G, gk, ja){
  var ln = x.ln, k = x.key, t = ln.type, pid = p.id, gap = gk && gk[k] ? " gap" : "", tx = ja ? '<span class="rs-tx pl-j"' + ja + '>' : '<span class="rs-tx">';
  if(t === "cue"){
    var lab = (ln.label ? '<b>' + esc(ln.label) + '</b> ' : "") + '<span class="muted">' + esc(ln.text || "") + '</span>';
    if(ln.nobox) return '<div class="rs-ln">' + tx + lab + '</span></div>';
    return '<div class="rs-ln' + gap + '">' + rsTick(pid, k, ln.label || "step") + tx + lab + '</span></div>';
  }
  if(t === "pages") return '<div class="rs-ln rs-pages">' + (ln.items || []).map(function(it, i){ return '<span class="rs-pg' + (gk && gk[k + ".p" + i] ? " gap" : "") + '">' + rsTick(pid, k + ".p" + i, it) + '<span>' + esc(it) + '</span></span>'; }).join("") + '</div>';
  if(t === "score"){
    var nd = rsGet(pid, k + ".x") === "n";
    return '<div class="rs-ln rs-score' + gap + (nd ? " off" : "") + '"><div class="rs-sc-top">' + (ja ? '<span class="pl-j"' + ja + '><b>' + esc(ln.label) + '</b></span>' : '<b>' + esc(ln.label) + '</b>') +
      G.map(function(s){ var kk = rsPer(k, s); return '<label class="rs-num">' + rsWho(s) + '<input type="text" inputmode="numeric" data-rsin="' + esc(kk) + '" value="' + esc(rsGet(pid, kk)) + '" aria-label="' + esc(ln.label + " score" + (s ? " " + s : "")) + '" autocomplete="off"><span>/' + esc(ln.n) + '</span></label>'; }).join("") +
      (ln.tag ? '<span class="rs-tag">' + esc(ln.tag) + '</span>' : "") + (ln.trap ? '<span class="rs-tag">trap: item ' + esc(ln.trap) + '</span>' : "") +
      '<button class="rs-nd' + (nd ? " on" : "") + '" data-a="rs-nd" data-k="' + esc(k) + '" aria-pressed="' + nd + '">not done</button></div>' +
      rsIn(pid, k + ".m", "Mistakes (4: he go)", ln.label + " mistakes") + '</div>';
  }
  if(t === "app"){
    var r = rsAppResult(p, ln), gm = rsAppGame(p, ln);
    return '<div class="rs-ln' + gap + '">' + (r ? '<span class="rs-tk y auto" title="Played in the app">✓</span>' : rsTick(pid, k, ln.label)) +
      tx + '<b>' + esc((ln._code ? ln._code + " " : "") + ln.label) + '</b> <span class="muted">' + esc(ln._note || (gm ? "app game" : "")) + (gm ? "" : " — app game not found in this lesson") + '</span>' +
      (r ? '<small class="rs-res">Played · ' + esc(r.score && r.score.text ? r.score.text : "saved") + '</small>' : "") + '</span>' +
      (gm ? '<button class="btn sm' + (r ? " ghost" : "") + '" data-a="rs-play" data-g="' + esc(gm.id) + '">' + (r ? "Play again" : "Play") + '</button>' : "") + '</div>';
  }

/* =====================================================================
   PHASE B (teacher only). After each lesson a planning chat does Phase B (run sheet + results -> Progress Tracker) and
   writes a phaseb row. This screen shows what's still owed. Nothing here goes near student pages, links or broadcasts.
   Taught = the run sheet has a mark, or the lesson has a result (homework results don't count). A pack dated after today
   isn't taught yet whatever it has (a skip ticked in advance). Day taught = the pack's date, else the first sign of it.
   Needs a look = no sign it was taught, but its date has passed (no date: the student has a newer lesson): usually a paper
   run sheet or a postponed lesson.
   ===================================================================== */

/* the first sign a lesson ran: its earliest in-lesson result, or its run sheet once it has a mark */
function pbSignal(p){
  var at = "";
  RESULTS.forEach(function(r){ if(r.packId === p.id && !r.homework && r.at && (!at || String(r.at) < at)) at = String(r.at); });
  var sh = SHEETS[p.id];
  if(sh && sh.marks && Object.keys(sh.marks).length){ var t = String(sh.updatedAt || sh.finishedAt || ""); if(!at || (t && t < at)) at = t || at || "x"; }

  PACKS.forEach(function(p){ var k = p.student || ""; (byStu[k] = byStu[k] || []).push(p); });
  Object.keys(byStu).forEach(function(k){ byStu[k] = packsByDate(byStu[k]); });
  PACKS.forEach(function(p){
    var date = String(p.date || "").slice(0, 10), sig = pbSignal(p), row = PHASEB[p.id], mine = byStu[p.student || ""], i = mine.indexOf(p);
    var o = { p:p, row:row || null, prev: mine[i + 1] || null, state:"later" };
    if(sig && !(date && date > td)){ o.state = "owed"; o.day = date || pbLocalDay(sig) || td; }
    else if(!sig && (date ? date < td : i > 0)){ o.state = "look"; o.day = date || String(p.updatedAt || "").slice(0, 10); }
    if(row) o.state = "done";

/* Screen fit: a game screen never scrolls. If what's on the stage is taller (or wider) than the screen,

   or the window turns, but not while the on-screen keyboard is up. */
var FIT_RO = null, FIT_BUSY = false, FIT_H = 0, FIT_W = 0;
/* Bingo's called line: chips that don't fit are hidden, not left hanging off the edge. */
function bgTrimCalled(){
  var c = document.querySelector("#app .calledbar .chips"); if(!c) return;
  var right = c.getBoundingClientRect().right;

function fitStage(){
  var st = document.querySelector("#app main.stage"); if(!st || UI.view !== "play" || FIT_BUSY) return;
